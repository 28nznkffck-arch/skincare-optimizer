<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f0">
  <meta name="description" content="予算と肌悩みから基礎化粧品を組み合わせる実験的なスキンケア最適化ツール。複数メーカーの公式商品情報を参照。">
  <title>スキンケア最適化ラボ｜試作</title>
  <link rel="stylesheet" href="./styles.css?v=0.7.1">
  <script type="module" src="./app.js?v=0.7.1"></script>
</head>
<body>
  <div id="app"><main class="loading">商品データを読み込み中…</main></div>
  <dialog id="excludeDialog" class="modal">
    <form method="dialog" id="excludeForm">
      <div class="modal-top"><div><div class="eyebrow">PERSONAL FILTER</div><h2>この商品を除外する</h2></div><button class="icon-button" type="button" id="closeDialog" aria-label="閉じる">×</button></div>
      <p id="excludeName" class="muted"></p>
      <p class="question">合わなかった理由（任意）</p>
      <div class="reasons">
        <label><input type="radio" name="reason" value="刺激があった"> 刺激があった</label>
        <label><input type="radio" name="reason" value="肌荒れ・吹き出物"> 肌荒れ・吹き出物</label>
        <label><input type="radio" name="reason" value="乾燥した"> 乾燥した</label>
        <label><input type="radio" name="reason" value="使用感や香りが苦手"> 使用感や香りが苦手</label>
        <label><input type="radio" name="reason" value="効果を感じなかった"> 効果を感じなかった</label>
      </div>
      <div class="modal-actions"><button class="button button-ghost" type="button" id="cancelExclude">キャンセル</button><button class="button button-dark" type="submit" value="exclude">この商品を除外</button></div>
    </form>
  </dialog>
</body>
</html>
