<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173d32">
  <meta name="description" content="男性向けスキンケア商品を予算と肌悩みで選ぶ提案ツール。複数メーカーの公式商品情報を参照。">
  <title>男性向けスキンケア最適化ラボ｜試作</title>
  <link rel="stylesheet" href="../dist/styles.css?v=0.9.13">
  <link rel="stylesheet" href="./men.css?v=0.9.8">
  <script id="app-script" type="module" src="../dist/app.js?v=0.9.13"></script>
</head>
<body class="men-theme">
  <div id="app"><main class="loading">商品データを読み込み中…</main></div>
  <dialog id="excludeDialog" class="modal">
    <form method="dialog" id="excludeForm">
      <div class="modal-top"><div><div class="eyebrow">PERSONAL FILTER</div><h2>この商品を除外する</h2></div><button class="icon-button" type="button" id="closeDialog" aria-label="閉じる">×</button></div>
      <p id="excludeName" class="muted"></p>
      <p class="question">合わなかった理由（任意）</p>
      <div class="reasons">
        <label><input type="radio" name="reason" value="刺激があった"> 刺激があった</label>
        <label><input type="radio" name="reason" value="肌荒れ・吹き出物"> 肌荒れ・吹き出物</label>
        <label><input type="radio" name="reason" value="乾燥した"> 乾燥した</label>
        <label><input type="radio" name="reason" value="使用感や香りが苦手"> 使用感や香りが苦手</label>
        <label><input type="radio" name="reason" value="効果を感じなかった"> 効果を感じなかった</label>
      </div>
      <div class="modal-actions"><button class="button button-ghost" type="button" id="cancelExclude">キャンセル</button><button class="button button-dark" type="submit" value="exclude">この商品を除外</button></div>
    </form>
  </dialog>
  <script id="startup-watchdog">
    (() => {
      const app=document.getElementById('app');
      const entry=document.getElementById('app-script');
      let timer,observer;
      const stop=()=>{clearTimeout(timer);observer?.disconnect();};
      const retryLink=()=>{
        const link=document.createElement('a');
        const url=new URL(window.location.href);
        url.searchParams.set('_reload',String(Date.now()));
        link.href=url.href;link.className='button startup-retry';link.textContent='もう一度読み込む';
        return link;
      };
      const fail=message=>{
        if(!app.querySelector('.loading'))return;
        stop();
        const panel=document.createElement('main');panel.className='error';panel.setAttribute('role','alert');
        const title=document.createElement('p');title.textContent='アプリの読み込みを完了できませんでした。';
        const detail=document.createElement('p');detail.textContent=message;
        panel.append(title,detail,retryLink());app.replaceChildren(panel);
      };
      entry.addEventListener('error',()=>fail('起動用ファイルを読み込めませんでした。'));
      window.addEventListener('error',event=>fail(event.message||'起動処理に失敗しました。'));
      window.addEventListener('unhandledrejection',event=>fail(event.reason?.message||'読み込み処理に失敗しました。'));
      observer=new MutationObserver(()=>{
        if(app.querySelector('.loading'))return;
        const error=app.querySelector('.error');
        stop();
        if(error && !error.querySelector('.startup-retry'))error.append(retryLink());
      });
      observer.observe(app,{childList:true,subtree:true});
      timer=setTimeout(()=>fail('通信に時間がかかっています。もう一度読み込んでください。'),25000);
    })();
  </script>
</body>
</html>
